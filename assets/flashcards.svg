<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ec"/><stop offset="1" stop-color="#ddd7c7"/></linearGradient>
</defs>
<rect width="480" height="300" fill="url(#bg)"/>
